name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libhdf5-dev liblapack-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - name: Check the generated result index
        run: python3 scripts/gen_index.py --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --release --locked
      - name: smoke Fourier elementwise
        run: >
          BENCH_KS=4 BENCH_R=10 BENCH_RUNS=1 BENCH_WARMUPS=0
          OUT_DIR=/tmp/smoke/raw
          cargo run --release --locked --bin elementwise_fourier
      - name: smoke Gaussian elementwise
        run: >
          BENCH_NS=2 BENCH_RUNS=1 BENCH_WARMUPS=0
          BENCH_INPUT_CACHE_DIR=/tmp/smoke-cache OUT_DIR=/tmp/smoke/raw
          cargo run --release --locked --bin elementwise_gauss2d_patched
      - name: smoke Gaussian MPO contraction using the shared cache
        run: >
          BENCH_NS=2 BENCH_RUNS=1 BENCH_WARMUPS=0
          BENCH_INPUT_CACHE_DIR=/tmp/smoke-cache OUT_DIR=/tmp/smoke/raw
          EXPORT_HDF5=/tmp/smoke-export
          cargo run --release --locked --bin mpo_mpo_aniso_patched
      - name: smoke vertex Bethe-Salpeter contraction (downloads one 3 MB input)
        run: >
          BENCH_VERTEX_TAUS=1e-4 BENCH_RUNS=1 BENCH_WARMUPS=0
          BENCH_INPUT_CACHE_DIR=/tmp/smoke-cache OUT_DIR=/tmp/smoke/raw
          cargo run --release --locked --bin vertex_bse
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - name: Julia cross-check of the MPO contraction inputs
        # Reads the HDF5 the smoke step exported and evaluates it in ITensors.jl
        # against the closed form the instance approximates.
        run: |
          julia --project=julia -e 'using Pkg; Pkg.instantiate()'
          julia --project=julia julia/check_mpo_mpo.jl /tmp/smoke-export 2
