[package]
name = "t4a-bench"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
tensor4all-simplett = { git = "https://github.com/tensor4all/tensor4all-rs", rev = "a5157385f58048355a28a6a003d4cb63d3b1349b", package = "tensor4all-simplett" }
tensor4all-aci = { git = "https://github.com/tensor4all/tensor4all-rs", rev = "a5157385f58048355a28a6a003d4cb63d3b1349b", package = "tensor4all-aci" }
tensor4all-treetn = { git = "https://github.com/tensor4all/tensor4all-rs", rev = "a5157385f58048355a28a6a003d4cb63d3b1349b", package = "tensor4all-treetn" }
tensor4all-itensorlike = { git = "https://github.com/tensor4all/tensor4all-rs", rev = "a5157385f58048355a28a6a003d4cb63d3b1349b", package = "tensor4all-itensorlike" }
tensor4all-partitionedtt = { git = "https://github.com/tensor4all/tensor4all-rs", rev = "a5157385f58048355a28a6a003d4cb63d3b1349b", package = "tensor4all-partitionedtt" }
tensor4all-partitionedtreetn = { git = "https://github.com/tensor4all/tensor4all-rs", rev = "a5157385f58048355a28a6a003d4cb63d3b1349b", package = "tensor4all-partitionedtreetn" }
tensor4all-interpolativeqtt = { git = "https://github.com/tensor4all/tensor4all-rs", rev = "a5157385f58048355a28a6a003d4cb63d3b1349b", package = "tensor4all-interpolativeqtt" }
tensor4all-hdf5 = { git = "https://github.com/tensor4all/tensor4all-rs", rev = "a5157385f58048355a28a6a003d4cb63d3b1349b", package = "tensor4all-hdf5" }
tensor4all-core = { git = "https://github.com/tensor4all/tensor4all-rs", rev = "a5157385f58048355a28a6a003d4cb63d3b1349b", package = "tensor4all-core" }
num-complex = "0.4"
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
libm = "0.2"

[profile.release]
debug = true
