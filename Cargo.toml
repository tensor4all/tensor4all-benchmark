[package]
name = "t4a-bench"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
tensor4all-simplett = { git = "https://github.com/tensor4all/tensor4all-rs", rev = "9e9aedaebe0d3918b34dd399ff0981e337f3835b", package = "tensor4all-simplett" }
tensor4all-aci = { git = "https://github.com/tensor4all/tensor4all-rs", rev = "9e9aedaebe0d3918b34dd399ff0981e337f3835b", package = "tensor4all-aci" }
tensor4all-treetn = { git = "https://github.com/tensor4all/tensor4all-rs", rev = "9e9aedaebe0d3918b34dd399ff0981e337f3835b", package = "tensor4all-treetn" }
tensor4all-itensorlike = { git = "https://github.com/tensor4all/tensor4all-rs", rev = "9e9aedaebe0d3918b34dd399ff0981e337f3835b", package = "tensor4all-itensorlike" }
tensor4all-partitionedtt = { git = "https://github.com/tensor4all/tensor4all-rs", rev = "9e9aedaebe0d3918b34dd399ff0981e337f3835b", package = "tensor4all-partitionedtt" }
tensor4all-partitionedtreetn = { git = "https://github.com/tensor4all/tensor4all-rs", rev = "9e9aedaebe0d3918b34dd399ff0981e337f3835b", package = "tensor4all-partitionedtreetn" }
tensor4all-quanticstci = { git = "https://github.com/tensor4all/tensor4all-rs", rev = "9e9aedaebe0d3918b34dd399ff0981e337f3835b", package = "tensor4all-quanticstci" }
tensor4all-interpolativeqtt = { git = "https://github.com/tensor4all/tensor4all-rs", rev = "9e9aedaebe0d3918b34dd399ff0981e337f3835b", package = "tensor4all-interpolativeqtt" }
tensor4all-hdf5 = { git = "https://github.com/tensor4all/tensor4all-rs", rev = "9e9aedaebe0d3918b34dd399ff0981e337f3835b", package = "tensor4all-hdf5" }
tensor4all-core = { git = "https://github.com/tensor4all/tensor4all-rs", rev = "9e9aedaebe0d3918b34dd399ff0981e337f3835b", package = "tensor4all-core" }
num-complex = "0.4"
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
libm = "0.2"

[patch."https://github.com/tensor4all/tensor4all-rs"]
tensor4all-simplett = { path = "../tensor4all-rs/.worktrees/adaptive-contract-scheduling/crates/tensor4all-simplett" }
tensor4all-aci = { path = "../tensor4all-rs/.worktrees/adaptive-contract-scheduling/crates/tensor4all-aci" }
tensor4all-treetn = { path = "../tensor4all-rs/.worktrees/adaptive-contract-scheduling/crates/tensor4all-treetn" }
tensor4all-itensorlike = { path = "../tensor4all-rs/.worktrees/adaptive-contract-scheduling/crates/tensor4all-itensorlike" }
tensor4all-partitionedtt = { path = "../tensor4all-rs/.worktrees/adaptive-contract-scheduling/crates/tensor4all-partitionedtt" }
tensor4all-partitionedtreetn = { path = "../tensor4all-rs/.worktrees/adaptive-contract-scheduling/crates/tensor4all-partitionedtreetn" }
tensor4all-quanticstci = { path = "../tensor4all-rs/.worktrees/adaptive-contract-scheduling/crates/tensor4all-quanticstci" }
tensor4all-interpolativeqtt = { path = "../tensor4all-rs/.worktrees/adaptive-contract-scheduling/crates/tensor4all-interpolativeqtt" }
tensor4all-hdf5 = { path = "../tensor4all-rs/.worktrees/adaptive-contract-scheduling/crates/tensor4all-hdf5" }
tensor4all-core = { path = "../tensor4all-rs/.worktrees/adaptive-contract-scheduling/crates/tensor4all-core" }

[profile.release]
debug = true
