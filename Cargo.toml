[package]
name = "t4a-bench"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
default = []
# The patched arms (src/patched.rs, the partitionedtt parts of src/patched_mpo.rs and the
# patched arms of the two Gaussian runners) are paused: tensor4all-rs#1005 removed
# tensor4all-partitionedtt, which they are built on. The feature is a marker that keeps
# that code in the tree; nothing is measured behind it and it does not build at this pin.
# The port is tracked in https://github.com/tensor4all/tensor4all-benchmark/issues/11.
patched-partitionedtt = []

[dependencies]
tensor4all-simplett = { git = "https://github.com/tensor4all/tensor4all-rs", rev = "c5f06db600aa5c8c1c40f4bf95b6e9476e552d9d", package = "tensor4all-simplett" }
tensor4all-aci = { git = "https://github.com/tensor4all/tensor4all-rs", rev = "c5f06db600aa5c8c1c40f4bf95b6e9476e552d9d", package = "tensor4all-aci" }
tensor4all-treetn = { git = "https://github.com/tensor4all/tensor4all-rs", rev = "c5f06db600aa5c8c1c40f4bf95b6e9476e552d9d", package = "tensor4all-treetn" }
tensor4all-itensorlike = { git = "https://github.com/tensor4all/tensor4all-rs", rev = "c5f06db600aa5c8c1c40f4bf95b6e9476e552d9d", package = "tensor4all-itensorlike" }
tensor4all-partitionedtreetn = { git = "https://github.com/tensor4all/tensor4all-rs", rev = "c5f06db600aa5c8c1c40f4bf95b6e9476e552d9d", package = "tensor4all-partitionedtreetn" }
tensor4all-interpolativeqtt = { git = "https://github.com/tensor4all/tensor4all-rs", rev = "c5f06db600aa5c8c1c40f4bf95b6e9476e552d9d", package = "tensor4all-interpolativeqtt" }
tensor4all-hdf5 = { git = "https://github.com/tensor4all/tensor4all-rs", rev = "c5f06db600aa5c8c1c40f4bf95b6e9476e552d9d", package = "tensor4all-hdf5" }
tensor4all-core = { git = "https://github.com/tensor4all/tensor4all-rs", rev = "c5f06db600aa5c8c1c40f4bf95b6e9476e552d9d", package = "tensor4all-core" }
num-complex = "0.4"
rand = "0.9"
rand_chacha = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
libm = "0.2"
hdf5-metno = { version = "0.12", default-features = false }

[profile.release]
debug = 0            # CARGO_PROFILE_RELEASE_DEBUG=true restores full debug info

# Dev and test builds do not read DWARF, and it multiplies what every target directory and the
# shared build cache hold.
[profile.dev]
debug = 0

[profile.test]
debug = 0
